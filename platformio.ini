; platformio.ini —— 一键命令行烧录配置（VS Code + PlatformIO 插件）
; 也可以用 Arduino IDE 直接打开同目录的 BlindGuide_Firmware.ino（二选一）
[env:esp32s3]
platform  = espressif32
board     = esp32-s3-devkitc-1        ; 正点原子 DNEP32S3 在 ArduinoIDE 中选 "ESP32S3 Dev Module"
framework = arduino

; 8MB PSRAM（DNEP32S3 载 ESP32-S3-WROOM-1-N8R8，OPI 型）
; 若你的模块是 QSPI PSRAM，把下一行改为：board_build.psram = qiopsi
board_build.psram = opi
board_build.f_cpu = 240000000L

build_flags =
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
    -DCORE_DEBUG_LEVEL=3

upload_speed = 921600
monitor_speed = 115200

lib_deps =
    adafruit/Adafruit NeoPixel @ ^1.12.0
    bblanchon/ArduinoJson @ ^6.21.3
    lvgl/lvgl @ ^8.3.0
    lovyan03/LovyanGFX @ ^1.0.0
    infinitespace/Arduino_TensorFlowLite @ ^2.10.0-ALPHA  ; 端侧 AI（TFLite Micro）

; 说明：esp_camera / WiFi / HTTPClient / BLE / SD / SPI / driver/i2s 均为
;       esp32 板级包自带；Base64 已改为内置实现（base64_util.h），无需安装。
;       安装命令： pio pkg install   （或点 PlatformIO 侧边栏 -> Build 自动安装）
;
; 若你使用「纯 ArduinoIDE」且不想引入 TFLite（只烧主循环/云端/离线），
; 可临时把 ondevice_detect.cpp 从工程中移除（不引用即可），不影响其它模块编译。
; 端侧 AI 需要 TFLite Micro，故用 PlatformIO 最省心（一条命令装齐依赖）。
